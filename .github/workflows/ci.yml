name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests und Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, intl, fileinfo
          coverage: none

      - name: Composer-Abhängigkeiten
        uses: ramsey/composer-install@v3

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm-Abhängigkeiten
        run: npm ci

      - name: Assets bauen
        run: npm run build

      - name: Anwendungsschlüssel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Codestil prüfen
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test
